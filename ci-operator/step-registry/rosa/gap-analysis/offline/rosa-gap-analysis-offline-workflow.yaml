workflow:
  as: rosa-gap-analysis-offline
  steps:
    env:
      OPENSHIFT_VERSION: ""
      OCM_LOGIN_ENV: "staging"
    pre:
    - ref: rosa-gap-analysis-setup
    - ref: rosa-gap-analysis-ocm-auth
    - ref: rosa-gap-analysis-resolve-versions
    test:
    - chain: rosa-gap-analysis-checks
    post:
    - ref: rosa-gap-analysis-report
    - ref: rosa-gap-analysis-cleanup
  documentation: |-
    Standalone rosa-gap-analysis workflow that runs the gap-all.sh checks as
    discrete, composable ci-operator steps (no cluster provisioning). Lifecycle:
      pre:  setup (prereqs) -> ocm-auth (token) -> resolve-versions
      test: rosa-gap-analysis-checks chain (global checks 1-13, feature-gates last)
      post: report (combined report) -> cleanup (scratch/secrets)

    Set OPENSHIFT_VERSION (e.g. 4.22 or 5.0) on the job, or override
    BASELINE/TARGET. Attach a cluster profile with an ocm-token for the
    OCM/ROSA-backed checks; they degrade gracefully otherwise. Checks 9-13 read
    Prow GCS snapshots/JUnit and SKIP when none are available.

    Composition: steps are independent refs. Reorder/add/remove checks by inlining
    the refs from the rosa-gap-analysis-checks chain into `test`. Note ci-operator
    `test` steps are fail-fast (a failing check skips the rest); to run every check
    in one pass and still fail the job on any standard FAIL, move the check refs to
    `post` with best_effort set to false.

    The live-cluster capture refs (rosa-gap-analysis-api-resources-and-crd,
    -critical-alerts, -cluster-install-delete-metrics) are separate producers used
    in e2e workflows' post phase; the analysis refs here (api-resources,
    critical-alerts-diff, cluster-install) consume the snapshots those produce.
