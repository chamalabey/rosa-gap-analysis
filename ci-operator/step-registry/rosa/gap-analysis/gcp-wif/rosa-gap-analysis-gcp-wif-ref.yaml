ref:
  as: rosa-gap-analysis-gcp-wif
  from: gap-analysis
  grace_period: 1m
  timeout: 30m
  commands: rosa-gap-analysis-gcp-wif-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 800Mi
  env:
  - name: OPENSHIFT_VERSION
    default: ""
    documentation: Single version to analyze (auto-resolves BASELINE/TARGET). Optional if rosa-gap-analysis-resolve-versions ran first.
  - name: BASELINE
    default: ""
    documentation: Explicit baseline version (used with TARGET).
  - name: TARGET
    default: ""
    documentation: Explicit target version (used with BASELINE).
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: OCM environment for login; OCM/ROSA-backed data degrades gracefully if unavailable.
  documentation: |-
    Runs gap-gcp-wif.py (Checks #3-4: GCP WIF templates and acknowledgments; skipped for 5.x targets). Standard check: FAIL fails the step. Reads resolved versions from ${SHARED_DIR}/gap-versions.env (or env),
    writes its report into ${SHARED_DIR}/gap-analysis-reports and ${ARTIFACT_DIR}.
    Requires the gap-analysis image (python3 + scripts/gap-*.py).
