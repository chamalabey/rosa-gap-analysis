ref:
  as: rosa-gap-analysis-ga-validation
  from: gap-analysis
  grace_period: 1m
  timeout: 40m
  commands: rosa-gap-analysis-ga-validation-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 800Mi
  env:
  - name: OPENSHIFT_VERSION
    default: ""
    documentation: Single version to validate (auto-resolves BASELINE/TARGET). Optional if rosa-gap-analysis-resolve-versions ran first.
  - name: BASELINE
    default: ""
    documentation: Explicit baseline version (used with TARGET).
  - name: TARGET
    default: ""
    documentation: Explicit target version (used with BASELINE).
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: OCM environment for login; OCM/ROSA-backed checks degrade gracefully if unavailable.
  documentation: |-
    ROSA Production GA Readiness validation (scripts/prod/gap-ga-validation.py),
    producing its own detailed GA-readiness report (HTML+JSON). Checks channel
    availability, ROSA CLI compatibility, marketplace availability (AWS/GCP),
    version gates, CI job status, SOP/runbook updates, and GCP WIF compatibility;
    exits non-zero when the target is not GA-ready.

    INTENTIONALLY STANDALONE: GA readiness is run manually by SREs and is NOT part
    of any CI workflow or the rosa-gap-analysis-checks chain. This ref exists only
    so GA readiness can be executed individually; it must not be added to a
    workflow/chain. See docs/ga-readiness-validation.md.

    Requires the gap-analysis image (python3 + scripts/prod/gap-ga-validation.py).
