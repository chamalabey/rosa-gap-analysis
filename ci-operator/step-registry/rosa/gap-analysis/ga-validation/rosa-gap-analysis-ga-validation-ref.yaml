ref:
  as: rosa-gap-analysis-ga-validation
  from: gap-analysis
  grace_period: 1m
  timeout: 40m
  commands: rosa-gap-analysis-ga-validation-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 800Mi
  env:
  - name: OPENSHIFT_VERSION
    default: ""
    documentation: Single version to validate (auto-resolves BASELINE/TARGET). Optional if rosa-gap-analysis-resolve-versions ran first.
  - name: BASELINE
    default: ""
    documentation: Explicit baseline version (used with TARGET).
  - name: TARGET
    default: ""
    documentation: Explicit target version (used with BASELINE).
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: OCM environment for login; OCM/ROSA-backed checks degrade gracefully if unavailable.
  documentation: |-
    Runs the ROSA Production GA Readiness validation (scripts/prod/gap-ga-validation.py)
    and writes its own detailed GA-readiness report (HTML+JSON) into
    ${SHARED_DIR}/gap-analysis-reports and ${ARTIFACT_DIR}. Checks channel
    availability, ROSA CLI compatibility, marketplace availability (AWS/GCP),
    version gates, CI job status, SOP/runbook updates, and GCP WIF compatibility.
    Exits non-zero when the target is not GA-ready (fails the step). Reads resolved
    versions from ${SHARED_DIR}/gap-versions.env (or env). This is a self-contained
    report (it does not need the aggregate report step). Requires the gap-analysis
    image (python3 + scripts/prod/gap-ga-validation.py).
